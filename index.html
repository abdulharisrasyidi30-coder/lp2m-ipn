<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP2M Institut Palapa Nusantara | Road Map Penelitian dan Pengabdian 2026–2030</title>
<meta name="description" content="Portal LP2M Institut Palapa Nusantara Lombok NTB: road map penelitian dan pengabdian 2026–2030, rumpun riset program studi, serta pedoman penulisan skripsi dan tesis.">
<meta property="og:title" content="LP2M Institut Palapa Nusantara">
<meta property="og:description" content="Road map penelitian dan pengabdian 2026–2030, pedoman skripsi dan tesis.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%230E1F3D'/%3E%3Crect x='8' y='8' width='12' height='12' transform='rotate(45 14 14)' fill='none' stroke='%23C9A24B' stroke-width='2'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A5C12}a:hover{color:#14213A}
a:focus-visible,button:focus-visible{outline:3px solid #C9A24B;outline-offset:2px}
button{font-family:inherit}
html{scroll-behavior:smooth}
</style>

<style>body{margin:0;background:#FAF7F0}</style>
</head>
<body>
<div id="app"></div>
<script id="tpl" type="text/template">

<div style="width: 100%; background: #FAF7F0; color: #14213A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.6">


<header style="background: #0E1F3D; border-bottom: 1px solid #2A3D63">
<div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="#beranda" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F4EFE2">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="4" width="20" height="20" transform="rotate(45 14 14)" fill="none" stroke="#C9A24B" stroke-width="2"/><circle cx="14" cy="14" r="3" fill="#C9A24B"/></svg>
<span style="display: flex; flex-direction: column; line-height: 1.2"><strong style="font-size: 15px; letter-spacing: 0.04em">LP2M</strong><span style="font-size: 12px; color: #B9C3D8">Institut Palapa Nusantara · Lombok NTB</span></span>
</a>
<nav aria-label="Navigasi utama" style="display: flex; flex-wrap: wrap; gap: 4px 6px">
<a href="#arah" style="color: #F4EFE2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px; min-height: 24px">Arah</a>
<a href="#roadmap" style="color: #F4EFE2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px">Peta Jalan</a>
<a href="#prodi" style="color: #F4EFE2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px">Program Studi</a>
<a href="#kpi" style="color: #F4EFE2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px">Target</a>
<a href="#mahasiswa" style="color: #F4EFE2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px">Mahasiswa</a>
<a href="#pedoman" style="color: #F4EFE2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px">Pedoman</a>
<a href="app/" style="color: #F4EFE2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 12px">Masuk</a>
<a href="#dokumen" style="color: #0E1F3D; background: #C9A24B; text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px">Dokumen</a>
</nav>
</div>
</header>


<section id="beranda" style="background: #0E1F3D; color: #F4EFE2">
<div style="max-width: 1120px; margin: 0 auto; padding: 72px 24px 80px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1 1 460px; min-width: 0">
<p style="margin: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A24B">Lembaga Penelitian dan Pengabdian kepada Masyarakat</p>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 60px; line-height: 1.05; letter-spacing: -0.01em">Road Map Penelitian &amp; Pengabdian <span style="color: #C9A24B">2026–2030</span></h1>
<p style="margin: 24px 0 0; font-size: 19px; line-height: 1.55; color: #D5DCEA; max-width: 560px">Menuju kemandirian riset dan pemberdayaan masyarakat pesisir-agraris Lombok dan Nusa Tenggara Barat. Satu pintu untuk dosen dan mahasiswa memahami arah riset kampus.</p>
<div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px">
<a href="#roadmap" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; background: #C9A24B; color: #0E1F3D; font-weight: 700; text-decoration: none; border-radius: 999px">Lihat peta jalan</a>
<a href="app/" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; background: #F4EFE2; color: #0E1F3D; font-weight: 700; text-decoration: none; border-radius: 999px">Masuk ke sistem</a>
<a href="#mahasiswa" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border: 1.5px solid #C9A24B; color: #F4EFE2; font-weight: 600; text-decoration: none; border-radius: 999px">Untuk mahasiswa</a>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; justify-content: center">
<svg viewBox="0 0 440 360" width="100%" style="max-width: 440px" role="img" aria-label="Lima tahap peta jalan 2026 sampai 2030 menuju kemandirian">
<path d="M40 310 C 140 300, 160 220, 220 210 S 320 130, 400 60" fill="none" stroke="#C9A24B" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
<g fill="#0E1F3D" stroke="#C9A24B" stroke-width="3">
<circle cx="40" cy="310" r="13"/><circle cx="130" cy="262" r="13"/><circle cx="220" cy="210" r="13"/><circle cx="312" cy="140" r="13"/><circle cx="400" cy="60" r="16" fill="#C9A24B"/>
</g>
<g font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="600" fill="#F4EFE2">
<text x="40" y="344" text-anchor="middle">2026</text><text x="130" y="296" text-anchor="middle">2027</text><text x="220" y="244" text-anchor="middle">2028</text><text x="312" y="174" text-anchor="middle">2029</text><text x="400" y="30" text-anchor="middle" fill="#C9A24B">2030</text>
</g>
</svg>
</div>
</div>
<div style="border-top: 1px solid #2A3D63">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))">
<sc-for list="{{heroStats}}" as="s" hint-placeholder-count="4">
<div style="padding: 24px 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 36px; font-weight: 700; color: #C9A24B; line-height: 1.1">{{s.value}}</span>
<span style="font-size: 14px; color: #B9C3D8">{{s.label}}</span>
</div>
</sc-for>
</div>
</div>
</section>


<section id="arah" style="padding: 88px 0 24px">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px">
<p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7A5C12">Arah kebijakan</p>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1.15; max-width: 760px">Dari tahap rintisan menuju pusat rujukan keilmuan</h2>
<p style="margin: 16px 0 0; font-size: 18px; color: #4A5670; max-width: 760px">Payung riset 2026–2030: <em>“Moderasi Beragama, Mutu Pendidikan Islam, dan Pemberdayaan Masyarakat Pesisir-Agraris Lombok berbasis Kearifan Lokal NTB”</em>. Seluruh program studi menurunkan riset dan pengabdiannya dari payung ini.</p>

<div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 420px; min-width: 0; background: #0E1F3D; color: #F4EFE2; border-radius: 16px; padding: 32px">
<h3 style="margin: 0 0 12px; font-family: 'Newsreader', Georgia, serif; font-size: 26px; color: #C9A24B">Visi LP2M 2030</h3>
<p style="margin: 0; font-size: 17px; color: #E4E9F3">Menjadi lembaga penelitian dan pengabdian kepada masyarakat yang unggul dan menjadi rujukan dalam pengembangan keilmuan Islam, moderasi beragama, dan pemberdayaan masyarakat berbasis kearifan lokal di Pulau Lombok dan Nusa Tenggara Barat pada tahun 2030.</p>
</div>
<div style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 16px; padding: 32px">
<h3 style="margin: 0 0 12px; font-family: 'Newsreader', Georgia, serif; font-size: 26px">Misi</h3>
<ol style="margin: 0; padding-left: 22px; color: #2A3652; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{misi}}" as="m" hint-placeholder-count="5"><li>{{m.t}}</li></sc-for>
</ol>
</div>
</div>

<h3 style="margin: 56px 0 20px; font-family: 'Newsreader', Georgia, serif; font-size: 28px">Tiga pilar payung penelitian</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px">
<sc-for list="{{pilar}}" as="p" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E3DCCB; border-top: 4px solid #C9A24B; border-radius: 12px; padding: 28px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #7A5C12">PILAR {{p.n}}</span>
<h4 style="margin: 8px 0 10px; font-family: 'Newsreader', Georgia, serif; font-size: 23px; line-height: 1.25">{{p.name}}</h4>
<p style="margin: 0; color: #4A5670">{{p.desc}}</p>
</article>
</sc-for>
</div>
</div>
</section>


<section id="roadmap" style="padding: 88px 0 24px">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px">
<p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7A5C12">Peta jalan 5 tahun</p>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1.15">Menuju kemandirian, tahun demi tahun</h2>
<p style="margin: 16px 0 0; font-size: 18px; color: #4A5670; max-width: 700px">Setiap tahap menjadi landasan tahap berikutnya. Pilih tahun untuk melihat fokus, target, dan indikator keberhasilan institusi.</p>

<div role="group" aria-label="Pilih tahun" style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{yearTabs}}" as="t" hint-placeholder-count="5">
<button type="button" data-h="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<div style="margin-top: 20px; background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 16px; padding: 36px; display: flex; flex-wrap: wrap; gap: 32px 48px">
<div style="flex: 1 1 260px; min-width: 0">
<div style="font-family: 'Newsreader', Georgia, serif; font-size: 72px; font-weight: 700; line-height: 1; color: #C9A24B">{{yr.year}}</div>
<h3 style="margin: 12px 0 4px; font-family: 'Newsreader', Georgia, serif; font-size: 28px; line-height: 1.2">{{yr.stage}}</h3>
<p style="margin: 0; font-style: italic; color: #4A5670">{{yr.en}}</p>
<p style="margin: 20px 0 0; color: #2A3652">{{yr.focus}}</p>
</div>
<div style="flex: 2 1 380px; min-width: 0">
<h4 style="margin: 0 0 12px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A5C12">Target dan capaian</h4>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{yr.targets}}" as="g" hint-placeholder-count="3">
<li style="display: flex; gap: 12px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; margin-top: 9px; background: #C9A24B; transform: rotate(45deg)"></span><span>{{g.t}}</span></li>
</sc-for>
</ul>
<div style="margin-top: 24px; background: #F4EEDC; border-radius: 10px; padding: 16px 20px">
<strong style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C4509">Indikator keberhasilan</strong>
<p style="margin: 4px 0 0; color: #2A3652">{{yr.indicator}}</p>
</div>
</div>
</div>
</div>
</section>


<section id="prodi" style="padding: 88px 0 24px">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px">
<p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7A5C12">Tujuh program studi</p>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1.15">Rumpun riset setiap program studi</h2>
<p style="margin: 16px 0 0; font-size: 18px; color: #4A5670; max-width: 700px">Pilih program studi untuk melihat rumpun risetnya, keterkaitan dengan tiga pilar, dan target kinerja 2030.</p>

<div role="group" aria-label="Pilih program studi" style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{prodiTabs}}" as="t" hint-placeholder-count="7">
<button type="button" data-h="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<div style="margin-top: 20px; background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 16px; padding: 36px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px">
<h3 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 30px; line-height: 1.2">{{pr.name}}</h3>
<span style="font-size: 14px; color: #4A5670">{{pr.level}} · Detail lengkap: {{pr.bab}}, halaman {{pr.hal}} dokumen</span>
</div>

<div style="margin-top: 28px; display: flex; flex-wrap: wrap; gap: 32px 48px">
<div style="flex: 1 1 320px; min-width: 0">
<h4 style="margin: 0 0 12px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A5C12">Rumpun riset utama</h4>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{pr.rumpun}}" as="r" hint-placeholder-count="4">
<li style="display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: #FAF7F0; border-radius: 10px"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #0E1F3D; color: #C9A24B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.n}}</span><span style="font-weight: 500">{{r.t}}</span></li>
</sc-for>
</ol>

<h4 style="margin: 28px 0 12px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A5C12">Keterkaitan dengan pilar</h4>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{pr.pilar}}" as="q" hint-placeholder-count="3">
<li style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px"><span>{{q.name}}</span><span style="{{q.style}}">{{q.label}}</span></li>
</sc-for>
</ul>
</div>

<div style="flex: 1 1 320px; min-width: 0">
<h4 style="margin: 0 0 12px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A5C12">Indikator kinerja utama</h4>
<div style="overflow-x: auto; border: 1px solid #E3DCCB; border-radius: 10px">
<table style="width: 100%; border-collapse: collapse; font-size: 15px; min-width: 340px">
<caption style="position: absolute; left: -9999px">Indikator kinerja program studi: kondisi 2026 dan target 2030</caption>
<thead><tr style="background: #0E1F3D; color: #F4EFE2; text-align: left"><th scope="col" style="padding: 12px 14px; font-weight: 600">Indikator</th><th scope="col" style="padding: 12px 14px; font-weight: 600">2026</th><th scope="col" style="padding: 12px 14px; font-weight: 600">Target 2030</th></tr></thead>
<tbody>
<sc-for list="{{pr.kpi}}" as="k" hint-placeholder-count="6">
<tr style="border-top: 1px solid #E3DCCB"><th scope="row" style="padding: 12px 14px; text-align: left; font-weight: 500">{{k.label}}</th><td style="padding: 12px 14px; color: #4A5670">{{k.base}}</td><td style="padding: 12px 14px; font-weight: 600">{{k.target}}</td></tr>
</sc-for>
</tbody>
</table>
</div>
</div>
</div>
</div>

<h3 style="margin: 56px 0 8px; font-family: 'Newsreader', Georgia, serif; font-size: 28px">Matriks ekosistem keilmuan</h3>
<p style="margin: 0 0 20px; color: #4A5670; max-width: 760px">Rumpun tarbiyah menggerakkan mutu pendidikan, Ekonomi Syariah dan Hukum Tata Negara memimpin pemberdayaan pesisir, dan moderasi beragama melintasi seluruh disiplin.</p>
<div style="overflow-x: auto; background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 12px">
<table style="width: 100%; border-collapse: collapse; font-size: 15px; min-width: 640px">
<caption style="position: absolute; left: -9999px">Keterkaitan program studi dengan tiga pilar payung penelitian</caption>
<thead><tr style="background: #0E1F3D; color: #F4EFE2; text-align: left"><th scope="col" style="padding: 14px 16px; font-weight: 600">Program studi</th><th scope="col" style="padding: 14px 16px; font-weight: 600">Moderasi beragama &amp; literasi keislaman</th><th scope="col" style="padding: 14px 16px; font-weight: 600">Mutu pendidikan berbasis riset</th><th scope="col" style="padding: 14px 16px; font-weight: 600">Pemberdayaan pesisir-agraris</th></tr></thead>
<tbody>
<sc-for list="{{matrix}}" as="m" hint-placeholder-count="7">
<tr style="border-top: 1px solid #E3DCCB"><th scope="row" style="padding: 12px 16px; text-align: left; font-weight: 600">{{m.code}}</th><td style="padding: 12px 16px"><span style="{{m.s1}}">{{m.l1}}</span></td><td style="padding: 12px 16px"><span style="{{m.s2}}">{{m.l2}}</span></td><td style="padding: 12px 16px"><span style="{{m.s3}}">{{m.l3}}</span></td></tr>
</sc-for>
</tbody>
</table>
</div>
</div>
</section>


<section id="kpi" style="padding: 88px 0 24px">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px">
<div style="background: #0E1F3D; color: #F4EFE2; border-radius: 20px; padding: 48px 40px">
<p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A24B">Target institusi</p>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1.15">Indikator kinerja utama institusi</h2>
<p style="margin: 12px 0 0; color: #B9C3D8; max-width: 640px">Akumulasi capaian seluruh program studi, dipantau setiap semester dan dievaluasi setiap akhir tahun akademik.</p>
<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{iku}}" as="i" hint-placeholder-count="6">
<div style="border: 1px solid #2F4570; border-radius: 12px; padding: 22px 24px">
<div style="font-family: 'Newsreader', Georgia, serif; font-size: 30px; font-weight: 700; color: #C9A24B; line-height: 1.15">{{i.value}}</div>
<div style="margin-top: 6px; color: #E4E9F3">{{i.label}}</div>
</div>
</sc-for>
</div>

<h3 style="margin: 48px 0 16px; font-family: 'Newsreader', Georgia, serif; font-size: 24px">Proyeksi publikasi dosen per program studi (artikel per tahun)</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<sc-for list="{{pubs}}" as="p" hint-placeholder-count="5">
<div style="background: #162B52; border-radius: 10px; padding: 16px 18px">
<div style="font-size: 14px; color: #B9C3D8">{{p.year}}</div>
<div style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 700">{{p.range}}</div>
</div>
</sc-for>
</div>
<p style="margin: 16px 0 0; font-size: 14px; color: #B9C3D8">Target minimal yang sama untuk ketujuh program studi dan diharapkan terlampaui.</p>
</div>
</div>
</section>


<section id="mahasiswa" style="padding: 88px 0 24px">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px">
<p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7A5C12">Untuk mahasiswa</p>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1.15; max-width: 760px">Mahasiswa adalah bagian dari mesin riset kampus</h2>
<p style="margin: 16px 0 0; font-size: 18px; color: #4A5670; max-width: 760px">Pada fase pemetaan 2026, mahasiswa tingkat akhir menjadi asisten riset institusi sehingga data baseline seluruh program studi dapat terkumpul dalam satu tahun akademik.</p>

<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<sc-for list="{{mhs}}" as="c" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E3DCCB; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: #F4EEDC; color: #5C4509; padding: 4px 10px; border-radius: 999px">{{c.tag}}</span>

const comp=new Component({});
const TPL=document.getElementById('tpl').textContent;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const get=(p,c)=>p.split('.').reduce((o,k)=>o==null?undefined:o[k],c);
let handlers=[];
function val(p,c){const v=get(p,c);if(typeof v==='function'){handlers.push(v);return String(handlers.length-1);}return v==null?'':esc(v);}
const fill=(s,c)=>s.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,(m,p)=>val(p,c));
function render(){
  const vals=comp.renderVals();handlers=[];
  const idx=[...document.querySelectorAll('[data-h]')].indexOf(document.activeElement);
  const y=window.scrollY;
  let out=TPL.replace(/<sc-for list="\{\{([\w.]+)\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,(m,list,as,body)=>(get(list,vals)||[]).map(item=>fill(body,Object.assign({},vals,{[as]:item}))).join(''));
  out=fill(out,vals);
  app.innerHTML=out;
  const els=app.querySelectorAll('[data-h]');
  els.forEach(el=>el.addEventListener('click',()=>handlers[+el.dataset.h]()));
  if(idx>=0&&els[idx])els[idx].focus({preventScroll:true});
  window.scrollTo(0,y);
}
render();
